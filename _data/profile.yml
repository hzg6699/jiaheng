  "short_bio": "<p>My background connects public health, clinical nutrition, and food science, with MPH training in Epidemiology and Biostatistics at The University of Hong Kong and a Bachelor of Food and Nutritional Sciences from Macau University of Science and Technology. I am interested in how diet, gut microbiota, and food quality shape metabolic health.</p><p>Across hospital, university, and industry settings, I have worked on dietary assessment in 618 cardiovascular inpatients, public health data management across 17 projects, probiotic interventions in obesity, and food preservation and safety. My skills include questionnaire-based research, anthropometric assessment, data validation, and statistical analysis using R, SPSS, and Excel. My laboratory experience spans HPLC, ELISA, qPCR, microbiological testing, and biochemical analysis, alongside food quality control within ISO 22000, HACCP, and GMP frameworks.</p><p>I am a co-first author of a <em>Nutrients</em> study on perceived versus actual dietary intake and a co-author of work on probiotics, fish preservation, and sustainable proteins. Teaching laboratory methods and serving as Vice President of the MUST Nutrition Society have also strengthened my skills in scientific communication, student support, and coordinating academic and community activities.</p>",
